    <meta

    <!-- ══════════════════════════════════════════════════════
         STRUCTURED DATA (JSON-LD)

         1. SoftwareApplication — core product schema with pricing
            and OS. Tells Google/Bing exactly what this is.

         2. FAQPage — AEO powerhouse. Each Q&A here is a candidate
            for a Google AI Overview snippet and a People Also Ask
            result. Questions are written in natural spoken language
            the way real users search.

         3. HowTo — helps surface Aullevo in "how to automate
            Workday applications" queries, a high-intent segment.

         4. BreadcrumbList — establishes site hierarchy signal.

         NOTE: add "aggregateRating" and real "offers" data once
         you have genuine reviews and confirmed pricing.
         Fake data = Google quality penalty.
    ══════════════════════════════════════════════════════ -->

    <!-- 1 · SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Aullevo",
        "alternateName": [
          "Aullevo AI Form Filler",
          "Aullevo Autofill Extension"
        ],
        "applicationCategory": "BrowserApplication",
        "applicationSubCategory": "Productivity",
        "operatingSystem": "Chrome, Edge, Brave",
        "url": "https://aullevo-web.vercel.app/",
        "description": "Aullevo is a secure, local AI autofill browser extension powered by Gemini. It automatically fills Workday job applications, HR onboarding forms, government paperwork, school surveys, and other complex online forms — without sending any data to external servers.",
        "featureList": [
          "AI-powered autofill for Workday job applications",
          "HR and onboarding form automation",
          "Government and tax form autofill",
          "School and university survey completion",
          "Runs locally — no data leaves your device",
          "Powered by Google Gemini AI",
          "Works on Chrome, Edge, and Brave"
        ],
        "keywords": "ai form filler, autofill extension, workday automation, hr form automation, government form filler, gemini ai autofill",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "390",
          "priceCurrency": "PHP",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>

    <!-- 2 · FAQPage (AEO — feeds AI Overviews & People Also Ask) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Aullevo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo is a free AI-powered browser extension that automatically fills out complex online forms — including Workday job applications, HR onboarding forms, government paperwork, and school surveys — using Google Gemini AI. All processing happens locally on your device, so your data never leaves your browser."
            }
          },
          {
            "@type": "Question",
            "name": "How does Aullevo autofill Workday job applications?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo detects form fields on Workday and other job application platforms, then uses Gemini AI to intelligently match your saved profile information to each field and fill them automatically — including dropdowns, checkboxes, and multi-step forms — in seconds."
            }
          },
          {
            "@type": "Question",
            "name": "Is Aullevo safe to use? Does it send my data anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, Aullevo is designed with privacy first. All AI processing runs locally on your device using Gemini. Your personal information, resume data, and form responses are never sent to Aullevo's servers or any third-party service."
            }
          },
          {
            "@type": "Question",
            "name": "Which forms and websites does Aullevo support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo supports a wide range of online forms including: Workday job applications, HR and employee onboarding forms, government and tax forms, school and university surveys, and most standard web-based forms with text fields, dropdowns, and checkboxes."
            }
          },
          {
            "@type": "Question",
            "name": "What browsers does Aullevo work on?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo works as a browser extension on Google Chrome, Microsoft Edge, and Brave. Support for additional Chromium-based browsers may be added in future updates."
            }
          },
          {
            "@type": "Question",
            "name": "Is Aullevo free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, Aullevo is free to use. You can install it as a browser extension on Chrome, Edge, or Brave at no cost."
            }
          },
          {
            "@type": "Question",
            "name": "What makes Aullevo better than a regular autofill or password manager?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Standard autofill tools like browser-built-in autofill or password managers only fill simple fields like name, email, and address. Aullevo uses AI to understand complex, multi-step forms — like Workday's job application flow — and intelligently fills every field including custom questions, work history dropdowns, and legal compliance sections."
            }
          }
        ]
      }
    </script>

    <!-- 3 · HowTo (targets "how to automate job applications" queries) -->
    <script type="application/ld+json">

        "@context": "https://schema.org",

          {
            "@type": "HowToStep",
            "position": 3,

            "@type": "HowToStep",
            "position": 4,
            "name": "Click Autofill",

          },
          {
            "@type": "HowToStep",
            "position": 5,
            "name": "Review and submit",
            "text": "Quickly review the filled fields, make any edits if needed, and submit your application."
          }
        ]
      }
    </script>
