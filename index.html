    <!-- Apply the saved/system theme before first paint (mirrors ThemeContext), so the page
         doesn't render in the default theme and then transition every element on load -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "light") document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>

    <!-- 2 · FAQPage (AEO — feeds AI Overviews & People Also Ask) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Aullevo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo is a free browser extension that fills out online forms for you, including job applications, HR onboarding forms, government paperwork, and school surveys. You save your details once in profiles encrypted on your device, then fill any form with one shortcut. Optional Google Gemini AI helps with harder questions."
            }
          },
          {
            "@type": "Question",
            "name": "How does Aullevo autofill Workday job applications?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo detects the form fields on job application pages, matches them to your saved profile using an offline matching engine, and fills them, including dropdowns, radio buttons, checkboxes, and file uploads. With AI Smart Fill on, the AI you choose (Gemini, ChatGPT, Claude, or your own server) helps with unusual questions. On multi-page applications, Pro's Auto-Pagination clicks Next for you; on Free, you press the shortcut on each page."
            }
          },
          {
            "@type": "Question",
            "name": "Is Aullevo safe to use? Does it send my data anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo is designed with privacy first. Your profiles and documents are encrypted on your device with your own passphrase and are never sent to Aullevo's servers. AI Smart Fill is optional: when on, the form's questions, your field labels, and values of fields you mark AI SAFE are sent to the AI provider you choose (Google Gemini, OpenAI, Anthropic, or your own server) using your own API key. Fields marked SENSITIVE are never sent."
            }
          },
          {
            "@type": "Question",
            "name": "Which forms and websites does Aullevo support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo works on most web forms, including job application portals, Google Forms, Microsoft Forms, HR and onboarding forms, government forms, and school surveys. It handles text fields, dropdowns, radio buttons, checkboxes, dates, grids, and file uploads, including inside Shadow DOM components and iframes."
            }
          },
          {
            "@type": "Question",
            "name": "What browsers does Aullevo work on?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aullevo works on Google Chrome, Microsoft Edge, and Brave. Firefox support is planned."
            }
          },
          {
            "@type": "Question",
            "name": "Is Aullevo on the Chrome Web Store?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. If you'd rather not download the ZIP, open the Chrome Web Store, search for Aullevo, and click Add to Chrome. You can also download the ZIP from aullevo-web.vercel.app and load it with Developer mode."
            }
          },
          {
            "@type": "Question",
            "name": "Is Aullevo free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The free plan includes the full form engine, all profile types, the encrypted vault, and 10 AI fills per week. Aullevo Pro ($2.50 for 30 days, $20 for a year, or $50 once for lifetime; no auto-renewal) adds unlimited AI fills, unlimited active profiles, Voice mode, Auto-Pagination for multi-page forms, automatic document uploads, extra typing speeds, and JSON import/export."
            }
          },
          {
            "@type": "Question",
            "name": "What makes Aullevo better than a regular autofill or password manager?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Browser autofill and password managers only fill simple fields like name, email, and address. Aullevo fills custom questions, dropdowns, radio buttons, grids, and file uploads using profiles you control, works inside Shadow DOM components and iframes, and can use AI for questions it has never seen."
            }
          }
        ]
      }
    </script>
